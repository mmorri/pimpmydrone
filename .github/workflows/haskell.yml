name: Haskell CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haskell
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            haskell/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('haskell/stack.yaml.lock', 'haskell/coverage-core.cabal') }}
          restore-keys: stack-${{ runner.os }}-
      - name: Build
        run: stack build --test --no-run-tests --copy-bins --local-bin-path bin
      - name: Test
        run: stack test
      - uses: actions/upload-artifact@v4
        with:
          name: haskell-bin
          path: haskell/bin
