name: Docker CI

on:
  push:
    branches: [main, master, fix/coverage-pipeline]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            haskell/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('haskell/stack.yaml.lock', 'haskell/coverage-core.cabal') }}
          restore-keys: stack-${{ runner.os }}-
      - name: Build planner binaries
        run: make haskell-build
      - name: Build image
        run: docker build -t pimpmydrone-web:ci .
      - name: Health check container
        run: |
          docker run -d --name pmd-ci -p 18080:8000 pimpmydrone-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health; then
              echo
              curl -fsS http://127.0.0.1:18080/api/health | grep -q partition_families
              docker rm -f pmd-ci
              exit 0
            fi
            sleep 3
          done
          docker logs pmd-ci || true
          docker rm -f pmd-ci || true
          exit 1
