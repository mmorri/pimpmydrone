[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet"
version = "0.4.0"
description = "Experimental multi-drone coverage planner — free, donation-funded, fly at your own risk"
readme = "README.md"
authors = [{name = "Maurizio Morri", email = "maurizio.morri@protonmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "ortools>=9.8",
  "rich>=13.7",
  "click>=8.1",
  "networkx>=3.2",
  "pillow>=10.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.28",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.0"]
onnx = ["onnxruntime>=1.17"]
vlm = ["httpx>=0.28"]
perception = ["httpx>=0.28"]

[project.scripts]
fleet = "fleet.cli:run"

[tool.uv]
dev-dependencies = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=24.3",
  "ruff>=0.4",
  "jsonschema>=4.20",
  "httpx>=0.28.1",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B"]
